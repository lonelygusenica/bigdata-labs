            <script nonce="hhZhBWjlMusrZmN368ieQw==">window.__preloadedData__ = {"apiData":{"errors":{},"getDiscountsPotential":{"associated-programs-frontend-st-v2":{"RUB":{"discount_event":null}}},"getLessonById":{"id":"a55e98e1-e9ed-4495-8aa7-e1334d3a0ae2","assessment_stats":null,"topic_id":"ed65075f-9ffa-4d0d-9273-7505233082da","topic_position":1,"topic_name":"Про SVG","trainer_lib_url":null,"course_id":"ba643748-bc59-42fa-a81f-8ce7cb67efc1","course_position":6,"course_type":1,"course_name":"Вёрстка: декорирование, подходы и инструменты","editor_settings":null,"solved":false,"next_lesson_id":"5f8c1402-0e75-4611-b8da-8f01aa3dc1b8","is_last_in_topic":false,"next_lesson_has_tasks":true,"position":4,"sprint_id":733937,"name":"Управляем SVG","theory":{"id":"77089bdb-df9a-4a1f-86b5-1af8dcb79102","tree_id":"c76f711f-c318-4dc5-95d5-513b30f4a8fc","type":"RootLayout","content":{},"nested":[{"id":"21dfd830-cf6c-467b-89fd-112c5d1cc181","tree_id":"c76f711f-c318-4dc5-95d5-513b30f4a8fc","type":"Markdown","content":{"type":"theory","markdown":"# Управляем SVG\n"},"nested":[]},{"id":"4d3c47d5-0334-46d4-9bdb-bd4d90689d7d","tree_id":"c76f711f-c318-4dc5-95d5-513b30f4a8fc","type":"Dialog","content":[{"side":"left","type":"text","message":"Знаете, Коко Шанель говорила, что роскошь — это когда изнанка так же красива, как и лицо.","character":"praktikum"}],"nested":[]},{"id":"0b7837e1-e25e-4d4c-8707-d27d7593af3d","tree_id":"c76f711f-c318-4dc5-95d5-513b30f4a8fc","type":"ActionButton","content":{"id":"5b0886d0-83d8-4349-a213-a77a56e2b5f5","text":"Прямо как дизайн и вёрстка","options":[],"questions":[]},"nested":[]},{"id":"1911eb13-40a1-4072-8376-56a0353f171a","tree_id":"c76f711f-c318-4dc5-95d5-513b30f4a8fc","type":"Markdown","content":{"type":"theory","markdown":"В прошлых уроках вы точно заметили тег `\u003Csvg\u003E`. Это очень важный тег, контейнер для нашего изображения. Если помните, в теме про CSS-свойства мы говорили про `:root` — корневой элемент. В HTML-разметке корневым элементом является тег `\u003Chtml\u003E`, а в SVG — как раз тег `\u003Csvg\u003E`.\n\nБез тега `\u003Csvg\u003E` браузер не понимает, что это за набор непонятных слов и цифр. Поэтому важно, чтобы этот тег обязательно был, когда мы работаем с SVG. Не удаляйте его.\n\nДля этого тега нужно добавлять такую запись: `xmlns=\"http:\u002F\u002Fwww.w3.org\u002F2000\u002Fsvg\"`, но не всегда. Атрибут нужен, когда:\n\n* SVG вставляем в отдельный файл;\n* SVG указываем после `\u003C\u002Fhtml\u003E`;\n* указываем SVG через data-формат;\n\nАтрибут не нужен, когда:\n\n* вставляем SVG прямо в HTML (до тега `\u003C\u002Fhtml\u003E`);\n* вставляем тег через `\u003Cimg\u003E`, `background-image`;\n* ссылаемся на SVG через `\u003Cuse\u003E`.\n\nЗапоминать его не нужно, обычно при экспорте картинок этот атрибут всегда будет. Просто проверяйте, что он на месте, и не удаляйте его, когда он нужен.\n\nВнутри `\u003Csvg\u003E` встречаются не только `\u003Cuse\u003E` и `\u003Csymbol\u003E`, но ещё и теги, которыми рисуется наша картинка.\n\nТегов SVG много, но с этими вы будете работать чаще всего:\n\n- `\u003Crect\u003E` — для прямоугольника\n- `\u003Ccircle\u003E` — для круга\n- `\u003Cpolygon\u003E` — для сложных замкнутых фигур\n- `\u003Cpath\u003E` — для сложных фигур, необязательно замкнутых\n\nНа самом деле тегов SVG гораздо больше, но с этими вы будете работать чаще всего.\n\nКак правило, менять формы SVG прямо в коде приходится нечасто. А если и нужно, удобнее это делать в визуальном редакторе. Поэтому пока достаточно будет понимать, что перед вами: круг, прямоугольник или сложная линия.\n\nЛюбому из этих тегов вы можете задавать атрибут класса, если хотите менять стили отдельным элементам.\n\nПоговорим ещё немного про атрибуты. Уже привычные вам `width` и `height` можно задавать для тега `\u003Csvg\u003E`. К ним в пару часто идёт атрибут `viewBox`."},"nested":[]},{"id":"a692963f-e458-4c21-9493-e85c261ed420","tree_id":"c76f711f-c318-4dc5-95d5-513b30f4a8fc","type":"ActionButton","content":{"id":"57b7e41f-1c8e-4400-bd19-1d91d8ae74f8","text":"Стоп… Что?","options":[],"questions":[]},"nested":[]},{"id":"65a9b75b-fb45-48be-a555-512ad946ad7d","tree_id":"c76f711f-c318-4dc5-95d5-513b30f4a8fc","type":"Markdown","content":{"type":"theory","markdown":"Атрибут `viewBox` создаёт окошко, в котором наша картинка будет показана. Значением этого атрибута должны быть четыре цифры: координата X, координата Y, ширина и высота. Размеры указываются без единиц измерения. Как правило, первые две цифры равны 0, а вторые две — указывают на размер «окошка». Например, так:\n\n```css\n\u003Csvg xmlns=\"http:\u002F\u002Fwww.w3.org\u002F2000\u002Fsvg\" viewBox=\"0 0 100 100\"\u003E\n\t…\n\u003C\u002Fsvg\u003E\n```\n\nВ этом случае окно для SVG начинается от 0 по горизонтали и вертикали и его размер 100 на 100 пикселей. Важно понимать, что элементы внутри могут иметь другие размеры, больше или меньше этого окна просмотра. При этом ширина и высота, указанные в `viewBox`, не равны количеству пикселей, которые займёт SVG на вашей странице по ширине и высоте. Это ориентиры для внутренней геометрии, координаты для рисования линий. Реальный размер картинки может быть совершенно любым. Его мы можем менять в CSS.\n\nВ примере ниже у иконки сердечка указан viewBox=\"0 0 500 500\". Кажется, что картинка должна быть 500 на 500 пикселей. Но по факту картинка адаптируется под ширину родителя. Попробуйте изменить ширину окна просмотра:"},"nested":[]},{"id":"6eaf765d-4a51-405e-befc-33f756a066aa","tree_id":"c76f711f-c318-4dc5-95d5-513b30f4a8fc","type":"WideLayout","content":{},"nested":[{"id":"29b6b631-6fc4-452b-ae95-66ba4c7e3c57","tree_id":"c76f711f-c318-4dc5-95d5-513b30f4a8fc","type":"Markdown","content":{"type":"theory","markdown":"{iframe:https:\u002F\u002Fsandbox.practicum-team.ru\u002Ftasks\u002F04-beautishcha\u002F01-vector\u002F05-read-n-manage\u002Fexample-01\u002Fpre|minWidth:400px|minHeight:600px}"},"nested":[]}]},{"id":"3bb7441e-ad07-40ec-ad6a-b0d91fb9598a","tree_id":"c76f711f-c318-4dc5-95d5-513b30f4a8fc","type":"Markdown","content":{"type":"theory","markdown":"Иногда бывает, что при импорте из Фигмы у картинки не указан параметр `viewBox`, только ширина и высота. В этом случае картинка не будет подстраиваться под размеры родителя.\n\nВ примере ниже розовой рамкой выделен реальный размер SVG, а голубой — размер родителя. Правая картинка с `viewBox` подстраивается под размеры родителя, а левая с шириной и высотой — нет."},"nested":[]},{"id":"3c31136f-89b7-4506-bdca-2edcb5ab1d17","tree_id":"c76f711f-c318-4dc5-95d5-513b30f4a8fc","type":"WideLayout","content":{},"nested":[{"id":"0eae2279-bdce-4412-a7af-9d24d676adb1","tree_id":"c76f711f-c318-4dc5-95d5-513b30f4a8fc","type":"Markdown","content":{"type":"theory","markdown":"{iframe:https:\u002F\u002Fsandbox.practicum-team.ru\u002Ftasks\u002F04-beautishcha\u002F01-vector\u002F05-read-n-manage\u002Fexample-02\u002Fpre|minWidth:400px|minHeight:600px}"},"nested":[]}]},{"id":"becf4061-05d5-4379-8fa2-be7a0365ee80","tree_id":"c76f711f-c318-4dc5-95d5-513b30f4a8fc","type":"Markdown","content":{"type":"theory","markdown":"Это несложно решить. Можно при оптимизации изображения в SVGOMG выбрать настройку «Prefer viewBox to width\u002Fheight». Тогда в итоговом коде ширина и высота будут заменены на `viewBox`.\n\n![](https:\u002F\u002Fpictures.s3.yandex.net:443\u002Fresources\u002FChitaem_i_upravliaem_SVG-1_1691375408.jpg)\n\nНу и осталось упомянуть только `id`, с которым вы уже знакомы. Его можно задавать любому элементу SVG.\n"},"nested":[]},{"id":"4f577853-ef0d-4106-95af-79c77899f1db","tree_id":"c76f711f-c318-4dc5-95d5-513b30f4a8fc","type":"ActionButton","content":{"id":"ebfce087-a8b4-44a7-8bea-8bd111d47290","text":"Всё в наших руках","options":[],"questions":[]},"nested":[]},{"id":"58f263ee-b57c-4c9d-89a3-06fcaa130ee9","tree_id":"c76f711f-c318-4dc5-95d5-513b30f4a8fc","type":"Markdown","content":{"type":"theory","markdown":"Что-то писать от руки или серьёзно менять в SVG вам придётся очень редко. Обычно всё нужное уже есть «из коробки» после экспорта из макета или со сторонних сайтов. Но нам было важно, чтобы вы могли открыть файл с картинкой и не испугаться неизведанного. \n\nТеперь перейдём к весёлому! К стилям SVG. Основные атрибуты, они же CSS-свойства, которые вам точно пригодятся:\n\n- `fill` — отвечает за наличие заливки и её цвет;\n- `stroke` — отвечает за наличие обводки и её цвет;\n- `stroke-width` — отвечает за ширину обводки.\n\nЗначениями для `fill` и `stroke` могут быть любые доступные в вебе цвета: HEX, RGB, ключевые слова. Кроме того, можно использовать ключевое слово `none`, тогда у элемента не будет обводки или фоновой заливки.\n\nДля `stroke-width` значением может быть положительное число без единиц измерения.\n\nДаже если цвета заливки и обводки указаны в разметке в виде атрибутов, мы можем поменять их в CSS.\n\nВ примере ниже в разметке задан синий цвет для заливки и красный для обводки. Но птичка жёлтая с оранжевой обводкой — как и указано в CSS-файле."},"nested":[]},{"id":"9b0ce9ff-9429-4369-b628-e228e4b41011","tree_id":"c76f711f-c318-4dc5-95d5-513b30f4a8fc","type":"WideLayout","content":{},"nested":[{"id":"b69e812d-3c3e-4476-9a60-362092022590","tree_id":"c76f711f-c318-4dc5-95d5-513b30f4a8fc","type":"Markdown","content":{"type":"theory","markdown":"{iframe:https:\u002F\u002Fsandbox.practicum-team.ru\u002Ftasks\u002F04-beautishcha\u002F01-vector\u002F05-read-n-manage\u002Fexample-03\u002Fpre|minWidth:400px|minHeight:600px}"},"nested":[]}]},{"id":"d54f91a7-47f3-4cae-9207-477351a52c59","tree_id":"c76f711f-c318-4dc5-95d5-513b30f4a8fc","type":"Markdown","content":{"type":"theory","markdown":"Можно использовать ключевое слово `currentColor`, чтобы цвет SVG-иконки подстраивался под цвет текста блока, в который она вставлена."},"nested":[]}]},"completion_time":5,"lesson_type":"web","tasks":[{"id":"283ab1c3-90f5-49bc-82cd-0783dbedc29d","description":"На SVG вы создадите один из раундов игры в крестики-нолики. Получится довольно красиво. Сейчас в тренажере всего один блок с классом `game`. Вам нужно:\n\n1. Создать корневой SVG-элемент с атрибутом `viewBox`. Начальные точки — нули по осям X и Y, а размеры 600 на 600. Не забудьте также обязательный атрибут `xmlns=\"http:\u002F\u002Fwww.w3.org\u002F2000\u002Fsvg\"`.\n2. Описать внутри SVG-элемента квадрат SVG-тегом `\u003Crect \u002F\u003E`. Чёрная обводка (`stroke` цвета `#000`), заливка (`fill`) цветом `#ffc802`, X и Y в нулевых значениях, высота и ширина по `600` единиц.\n3. Задать прямоугольнику класс `field` для будущей стилизации","solved":true,"hints":[{"id":"cd737bfd-ed32-440e-9b3f-db7b71c0bd16","task_id":"283ab1c3-90f5-49bc-82cd-0783dbedc29d","content":"В этой задачке дадим вам списать, списывайте с умом.\n\n```html\n\u003Csvg xmlns=\"http:\u002F\u002Fwww.w3.org\u002F2000\u002Fsvg\" viewBox=\"0 0 600 600\"\u003E\n  \u003Crect\n    class=\"field\"\n    stroke=\"#000\"\n    fill=\"#ffc802\"\n    x=\"0\"\n    y=\"0\"\n    width=\"600\"\n    height=\"600\"\n  \u002F\u003E\n\u003C\u002Fsvg\u003E\n```","position":0}]},{"id":"6c740ed8-f812-4510-a4a9-979e9749b0b9","description":"Теперь игровое поле нужно расчертить. Для этого потребуется четыре линии. В SVG есть тег `\u003Cline \u002F` на такой случай. Вот что должно получиться:\n\n![](https:\u002F\u002Fpictures.s3.yandex.net\u002Fresources\u002FUntitled_1_1724061736.png)\n\nОбводка всех линий чёрная, а размер клетки — 200 на 200. Этой информации достаточно, чтобы решить задачу.","solved":false,"hints":[{"id":"d2a1aa84-8341-4f65-a1c5-8019b76e912a","task_id":"6c740ed8-f812-4510-a4a9-979e9749b0b9","content":"Две вертикальные линии, сделайте горизонтальные по аналогии:\n\n```html\n\u003Cline x1=\"200\" y1=\"0\" x2=\"200\" y2=\"600\" stroke=\"#000\"\u003E\u003C\u002Fline\u003E\n\u003Cline x1=\"400\" y1=\"0\" x2=\"400\" y2=\"600\" stroke=\"#000\"\u003E\u003C\u002Fline\u003E\n```","position":0}]},{"id":"ab14bbec-af35-4eec-acf7-5a37171cf9dc","description":"Теперь начнём играть. Нужно нарисовать крестик и нолик. Выглядеть должно вот так:\n\n![](https:\u002F\u002Fpictures.s3.yandex.net\u002Fresources\u002FUntitled_2_1724062107.png)\n\n1. Сначала создайте две группы тегом `\u003Cg\u003E` присвойте первой группе класс `cross`, а второй — `circle`.\n2. В первой группе нарисуйте две чёрные линии. Чтобы рассчитать координаты начальных и конечных точек вам достаточно знать, что внутренний отступ в ячейке — 20, а размер ячейки — 200.\n3. Нарисуйте внутри второй группы круг тегом `\u003Ccircle \u002F\u003E` . Чёрная обводка, радиус — 90, а координаты центральной точки вы можете рассчитать, зная, что размер ячейки — 200.\n\n**Дополнение про расчёт координат**\nВсе координаты (x1, y1, x2, y2, cx, cy) рассчитываются, исходя из того, что левый верхний угол SVG-области имеет координаты (0, 0).","solved":false,"hints":[{"id":"0fea71f7-f542-4bb5-9f6e-75767fb8e720","task_id":"ab14bbec-af35-4eec-acf7-5a37171cf9dc","content":"Подскажем начальные и конечные точки для линий:\n\n```html\nx1=\"20\" y1=\"20\" x2=\"180\" y2=\"180\"\nx1=\"20\" y1=\"180\" x2=\"180\" y2=\"20\"\n```\n\nА такие атрибуты у тега `\u003Ccircle \u002F\u003E`:\n\n```html\ncx=\"300\" cy=\"100\" r=\"90\" stroke=\"#000\" fill=\"none\"\n```","position":0}]},{"id":"419f2b3f-73ef-4cd4-bfcc-178a80dedf92","description":"Теперь нарисуем исход игры. Пусть он будет таким:\n\n![](https:\u002F\u002Fpictures.s3.yandex.net\u002Fresources\u002FUntitled_3_1724062162.png)\n\nМожно высчитывать координаты всех начальных и конечных точек, а также центра, но мы пойдём другим путём. Превратим крестик и нолик вместо группы в символ (`\u003Csymbol\u003E`), созданный специально, чтобы повторно использовать его много раз. Для этого:\n\n1. Замените теги `\u003Cg\u003E` на теги `\u003Csymbol\u003E`, а атрибуты `class` на `id` с теми же значениями.\n2. Замените координаты центра в круге на `100` и `100`. Символы не видны, они шаблон. Мы будем указывать, куда вставлять его, а значит, не хотим, чтобы центр круга был так далеко от точки вставки.\n\nКогда вы подготовите символы, из браузера пропадут изображения. Теперь символы нужно вставить в нужные ячейки. Для этого используйте тег `\u003Cuse \u002F\u003E`. В качестве ссылки передавайте значение `id`, а в качестве атрибутов `x` и `y` — координаты левого верхнего угла каждой ячейки.","solved":false,"hints":[{"id":"4db0d667-8d0f-4b7c-b4f5-3bc881c291c8","task_id":"419f2b3f-73ef-4cd4-bfcc-178a80dedf92","content":"Вот символ круга для примера:\n\n```html\n\u003Csymbol id=\"round\"\u003E\n  \u003Ccircle cx=\"100\" cy=\"100\" r=\"90\" stroke=\"#000\" fill=\"none\"\u003E\u003C\u002Fcircle\u003E\n\u003C\u002Fsymbol\u003E\n```\n\nА вот использование круга в левой нижней ячейке:\n\n```html\n\u003Cuse href=\"#round\" x=\"0\" y=\"400\"\u003E\u003C\u002Fuse\u003E\n```","position":0}]},{"id":"42fee5bd-d305-478c-84a6-75a9d7f1c761","description":"Хочется как-то показать победный ход. Мы решили сделать это такой каракулей:\n\n![](https:\u002F\u002Fpictures.s3.yandex.net\u002Fresources\u002FUntitled_4_1724062195.png)\n\nТакие сложные фигуры описывают в SVG тегом `\u003Cpath \u002F\u003E`. Этим тегом можно нарисовать вообще что угодно. Ключевой атрибут в этом теге — `d`, в нём хранится набор точек, из которых состоит фигура. Этот набор точек можно скопировать из любого векторного графического редактора. Мы сделали это за вас:\n\n```html\nM47.0663883,71.9328271 C68.5288042,68.7247261 124.508308,48.5088162 138.769861,52.5546471 C142.30563,53.5577021 135.56065,59.23373 133.283746,62.1187756 C108.428258,93.6129514 82.459412,124.215175 57.4534342,155.589997 C54.6314807,159.130682 45.8125544,168.922856 49.8277333,166.830439 C63.5932537,159.656858 74.9014514,148.513702 87.7489846,139.802175 C108.177939,125.949914 122.671177,116.994834 144.658292,106.897672 C148.216558,105.263606 172.229954,94.433399 179.434171,97.2725863 C181.829292,98.2165055 180.506039,102.655158 179.434171,104.995818 C176.914518,110.498031 151.066809,148.740082 155.404983,156.004503 C162.381633,167.687141 161.440304,145.460813 167.693883,153.4 :"bbff0ac1-7d27-4e60-b0a4-70476b496c9f","track_name":"Студенческий","use_assessment_squad_assignment":false,"current_assessment_squad_assignment":null,"assessment_max_score":null},"getTaskById":{"id":"6c740ed8-f812-4510-a4a9-979e9749b0b9","lesson_id":"a55e98e1-e9ed-4495-8aa7-e1334d3a0ae2","description":"Теперь игровое поле нужно расчертить. Для этого потребуется четыре линии. В SVG есть тег `\u003Cline \u002F` на такой случай. Вот что должно получиться:\n\n![](https:\u002F\u002Fpictures.s3.yandex.net\u002Fresources\u002FUntitled_1_1724061736.png)\n\nОбводка всех линий чёрная, а размер клетки — 200 на 200. Этой информации достаточно, чтобы решить задачу.","test":"\u002F\u002Fhttps:\u002F\u002Fst.yandex-team.ru\u002FPRACTICUMFB-17341\n\nconst errors = [];\nconst index = Tester.getPaneContent(panes, \"index.html\");\ntry {\n    const parser = new DOMParser();\n    const doc = parser.parseFromString(index, \"image\u002Fsvg+xml\");\n    const svg = doc.querySelectorAll(\"svg\");\n    if (svg.length !== 1) {\n        throw new Error();\n    }\n} catch {\n    \u002F\u002Ferrors.push(\"Нужен только один тег `svg`.\");\n    errors.push({\n        id: \"test.errors.frontend-developer.svg.6\",\n        values: {}\n    });\n}\ntry {\n    const parser = new DOMParser();\n    const doc = parser.parseFromString(index, \"image\u002Fsvg+xml\");\n    const line = doc.querySelectorAll(\"svg\u003Eline\");\n    if (line.length \u003C 4) {\n        throw new Error();\n    }\n} catch {\n    errors.push(\"Для этого потребуется четыре линии.\");\n}\ntry {\n    const parser = new DOMParser();\n    const doc = parser.parseFromString(index, \"image\u002Fsvg+xml\");\n    const lines = doc.getElementsByTagName(\"line\");\n    let hasLine = false;\n    for (const line of lines) {\n        let c_x1 = false;\n        let c_x2 = false;\n        let c_y1 = false;\n        let c_y2 = false;\n        let c_s = false;\n        if (line.getAttribute(\"x1\") === \"200\") {\n            c_x1 = true;\n        }\n        if (line.getAttribute(\"y1\") === \"0\") {\n            c_y1 = true;\n        }\n        if (line.getAttribute(\"x2\") === \"200\") {\n            c_x2 = true;\n        }\n        if (line.getAttribute(\"y2\") === \"600\") {\n            c_y2 = true;\n        }\n        if (line.getAttribute(\"stroke\") === \"#000\") {\n            c_s = true;\n        }\n        if (c_x1 === true && c_x2 === true && c_y1 === true && c_y2 === true && c_s === true) {\n            hasLine = true;\n        }\n    }\n    if (!hasLine) {\n        throw new Error();\n    }\n} catch {\n    errors.push('\u003Cline x1=\"200\" y1=\"0\" x2=\"200\" y2=\"600\" stroke=\"#000\"\u003E\u003C\u002Fline\u003E');\n}\ntry {\n    const parser = new DOMParser();\n    const doc = parser.parseFromString(index, \"image\u002Fsvg+xml\");\n    const lines = doc.getElementsByTagName(\"line\");\n    let hasLine = false;\n    for (const line of lines) {\n        let c_x1 = false;\n        let c_x2 = false;\n        let c_y1 = false;\n        let c_y2 = false;\n        let c_s = false;\n        if (line.getAttribute(\"x1\") === \"400\") {\n            c_x1 = true;\n        }\n        if (line.getAttribute(\"y1\") === \"0\") {\n            c_y1 = true;\n        }\n        if (line.getAttribute(\"x2\") === \"400\") {\n            c_x2 = true;\n        }\n        if (line.getAttribute(\"y2\") === \"600\") {\n            c_y2 = true;\n        }\n        if (line.getAttribute(\"stroke\") === \"#000\") {\n            c_s = true;\n        }\n        if (c_x1 === true && c_x2 === true && c_y1 === true && c_y2 === true && c_s === true) {\n            hasLine = true;\n        }\n    }\n    if (!hasLine) {\n        throw new Error();\n    }\n} catch {\n    errors.push('\u003Cline x1=\"400\" y1=\"0\" x2=\"400\" y2=\"600\" stroke=\"#000\"\u003E\u003C\u002Fline\u003E');\n}\ntry {\n    const parser = new DOMParser();\n    const doc = parser.parseFromString(index, \"image\u002Fsvg+xml\");\n    const lines = doc.getEl стыми словами — привлекает новых сотрудников и делает так, чтобы старые не хотели уходить.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EК сожалению, в Практикуме пока нет курса по этой профессии."},"msu-brand-manager":{"name":"Бренд-менеджер","description":"Задача \u003Cb\u003Eбренд-менеджера\u003C\u002Fb\u003E — повысить узнаваемость бренда и управлять его восприятием, сделать так, чтобы компанию знали как можно больше людей и узнавали её по одному только взгляду на логотип. Для этого разрабатываются бренд-стратегия, бренд-платформа и брендбук, реализуются стратегические и тактические кампании продвижения."},"msu-advertising-manager":{"name":"Менеджер по рекламе","description":"\u003Cb\u003EМенеджер по рекламе\u003C\u002Fb\u003E разрабатывает рекламные кампании и специальные проекты в рамках бренд-активностей. Он формирует и оценивает медиаплан и креативы, взаимодействует с подрядчиками, работает со всеми типами коммуникаций, адаптирует бренд-стратегии и активирует точки контакта с потребителями.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EК сожалению, у нас пока нет такого курса, но можно начать с чего-то попроще — например, пройти курс «Анализ и оценка рынка»."},"msu-marketing-research":{"name":"Маркетинговый исследователь","description":"\u003Cb\u003EМаркетинговый исследователь\u003C\u002Fb\u003E планирует и организует исследования полного цикла — от разработки дизайна исследования до предоставления рекомендаций заказчику. На основе результатов команда принимает решения, связанные с внедрением новых продуктов или улучшением текущих, может отслеживать показатели здоровья компании, развивать стратегию бренда.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EВ Практикуме пока нет такого курса, но можно присмотреться к направлению аналитики или пройти курс «Анализ и оценка рынка»."},"msu-Т-and-D":{"name":"Специалист по обучению персонала","description":"\u003Cb\u003EСпециалист по обучению персонала\u003C\u002Fb\u003E организовывает и планирует процесс обучения сотрудников, разрабатывает обучающие электронные курсы, участвует в формировании и внедрении подхода по адаптации сотрудников. Также он готовит материалы для тренингов и курсов, оценивает эффективность обучения и формирует статистику.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EК сожалению, у нас пока нет курса по этой профессии."},"msu-web-analyst":{"name":"Маркетинговый аналитик","description":"\u003Cb\u003EМаркетинговый аналитик\u003C\u002Fb\u003E добывает данные, на основе которых команда принимает продуктовые решения. В рабочие обязанности входит аудит и настройка аналитических инструментов (Amplitude, Firebase, Tableau), генерация и проверка гипотез, поиск точек роста продукта, дизайн, сопровождение и анализ A\u002FB-тестов, оценка объёмов рынков, составление портрета потребителя, подготовка презентаций с результатами.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EВ Практикуме пока нет курса по этой профессии, но есть много других в направлениях маркетинга и аналитики."},"msu-content-marketing":{"name":"Контент-маркетолог","description":"Главная задача — продвигать бренд и продукт компании в соцсетях, СМИ, на сайтах и других площадках. \u003Cb\u003EКонтент-маркетолог\u003C\u002Fb\u003E составляет и реализует контент-план в социальных сетях, например в VK, TikTok, YouTube. А также создаёт и размещает контент, работает с email-рассылками, статьями и подборками материалов, общается с подрядчиками, ищет новые способы привлечения клиентов и увеличения продаж."},"msu-strategic-planning":{"name":"Специалист по стратегическому планированию","description":"\u003Cb\u003EСпециалист по стратегическому планированию\u003C\u002Fb\u003E помогает развивать бизнес через анализ и планирование процессов и основных показателей деятельности компании. В том числе — анализирует деятельность бренда, рынок, конкурентную среду, предпочтения и мотивы потребителей, проводит глубинные интервью. Разрабатывает позиционирование и коммуникационные стратегии.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EВ Практикуме пока нет курса по этой профессии, но мы рекомендуем обратить внимание на курсы в направлении аналитики. "},"msu-HR-generalist":{"name":"Менеджер по персоналу","description":"\u003Cb\u003EМенеджер по персоналу\u003C\u002Fb\u003E делает так, чтобы процесс поиска, найма и адаптации сотрудников был максимально комфортным как для компании, так и для самих сотрудников. Для этого он участвует в формировании и реализации HR-стратегии компании, обеспечивает процессы, внедреяет и поддерживает систему мотивации, формирует эффективные взаимоотношения с бизнес-подразделениями, развивает корпоративную культуру и систему коммуникаций."},"msu-mobile-marketing":{"name":"Специалист по мобильному маркетингу","description":"\u003Cb\u003EСпециалист по мобильному маркетингу\u003C\u002Fb\u003E привлекает клиентов или продвигает продукт через мобильные устройства — ведёт рекламные кампании в Google Ads, ASA, MyTarget, Яндекс Директе, Appnext, TikTok, формирует и тестирует гипотезы, анализирует и интерпретирует результаты, готовит отчёты, ставит задачи аналитикам и продактам, контролирует их выполнение.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EВ Практикуме нет такого курса, но можно начать с курса «Анализ и оценка рынка» или «Интернет-маркетолог»."},"msu-internal-communications-manager":{"name":"Менеджер по внутренним коммуникациям","description":"\u003Cb\u003EМенеджер по внутренним коммуникациям\u003C\u002Fb\u003E разрабатывает и реализует стратегии по развитию внутренних коммуникаций, корпоративной культуры, бренда работодателя.  Он развивает каналы коммуникаций для разных целевых аудиторий и оценивает их эффективность, проводит исследования, ищет и анализирует новые нестандартные форматы и решения для повышения лояльности сотрудников.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EК сожалению, в Практикуме пока не обучают этой профессии, но мы регулярно добавляем в каталог новые курсы."},"msu-product-marketing-mangement":{"name":"Продуктовый маркетолог","description":"\u003Cb\u003EПродуктовый маркетолог\u003C\u002Fb\u003E помогает сделать из процессов запуска продукта единую систему. Он управляет всеми критериями, которые влияют на качество и успешность продукта. А ещё работает в постоянной связке с командой маркетинга, учебным отделом, продактами, дизайнерами, райтерами и отделом продаж. Главная задача продуктового маркетолога — объединить и проконтролировать все ресурсы для успешного выхода продукта на рынок.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EВ Практикуме пока не обучают этой профессии, но в каталоге есть курсы по направлениям маркетинга и аналитики, которые могут вам подойти."},"msu-game-developer":{"name":"Разработчик игр","description":"\u003Cb\u003EГейм-разработчики\u003C\u002Fb\u003E создают мобильные, компьютерные или игры для приставок и VR. Для разработки на каждую консоль или платформу нужен отдельный программист, художник, гейм-дизайнер, поэтому часто гейм-разработчики занимаются сразу несколькими направлениями. Они пишут код на Java, JavaScript, Python, Swift и других языках, а ещё много взаимодействуют с командой. Кроме технических знаний также пригодятся навыки коммуникации, усидчивость, креативность. \u003Cbr\u002F\u003E\u003Cbr\u002F\u003EУ нас нет специального курса по разработке игр, но можно начать с изучения Python или Java."},"msu-motion-designer":{"name":"Моушн-дизайнер","description":"\u003Cb\u003EМоушен-дизайнер\u003C\u002Fb\u003E «оживляет» изображения и создаёт с нуля анимационные проекты 2D и 3D. Это может быть инфографика, broadcast-дизайн, оформление блогов, роликов, презентационных фильмов, анимация, визуализация объектов, заставки, видеоэффекты. Также такой дизайнер может выступать режиссёром и монтажёром роликов, создавать гайды для других дизайнеров и аниматоров, заниматься адаптацией, ресайзом, локализацией материалов."},"msu-game-designer":{"name":"Гейм-дизайнер","description":"\u003Cb\u003EГейм-дизайнер\u003C\u002Fb\u003E — это режиссёр компьютерных игр, который отвечает за продумывание игрового процесса и разработку правил. Для этого он сотрудничает с дизайнерами и менеджерами, документирует идеи, концепции и технические проекты, разрабатывает дизайн UX-потока и каркасов пользовательского интерфейса. А также анализирует тенденции рынка и подходы конкурентов к дизайну игр, представляет новые игровые концепции и проекты заинтересованным сторонам.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EК сожалению, у нас пока нет курса по этой специальности, но можно начать с чего-то попроще в сфере дизайна или разработки."},"msu-finance-management":{"name":"Финансовый менеджер","description":"\u003Cb\u003EФинансовый менеджер\u003C\u002Fb\u003E помогает управлять компанией — контролирует и ведёт управленческий учёт, готовит бюджет и план-факторный анализ, составляет регулярные отчёты по динамике операционных и финансовых показателей. А ещё занимается финансовым моделированием и анализом проектов, много взаимодействует с бухгалтерией.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EВ Практикуме есть курс по этой специальности для людей с опытом в бухгалтерии, экономике, финансах. Если у вас нет такого опыта — рекомендуем начать с чего-то попроще."},"msu-traffic-manager-seo":{"name":"SEO-специалист","description":"\u003Cb\u003ESEO-специалист\u003C\u002Fb\u003E занимается продвижением сайтов в поисковых системах, чтобы их увидело как можно больше потенциальных клиентов. Для этого он делает семантический анализ запросов, готовит рекомендации по поисковому продвижению сайта, проводит внутреннюю и внешнюю оптимизацию сайтов. А ещё — тесно взаимодействует с отделом интернет-маркетинга, разработки и редакцией."}}},"motivationTest":{"title":"Пройдите тест и получите персональные советы","description":"Как учиться с удовольствием, справляться с тревогой и сдавать проекты вовремя","slides":[{"slideDescription":"Соедините утверждения справа и слева так,чтобы они описывали вас лучше всего","questions":[{"text":"Я мечтаю быть одним из лучших студентов в группе и достигать высоких результатов в учёбе","motivationType":"achievement"},{"text":"Мне важно иметь возможность обсуждать учёбу и делиться впечатлениями с теми, кто тоже учится","motivationType":"communication"},{"text":"Я хочу чётко понимать, как будет проходить учёба и сколько времени и усилий я на неё потрачу","motivationType":"stability"},{"text":"Я испытываю удовольствие, когда понимаю, что становлюсь экспертом в выбранной сфере","motivationType":"accuracy"}],"variants":[{"text":"Точно про меня","value":3},{"text":"Скорее про меня","value":2},{"text":"Иногда про меня","value":1},{"text":"Совсем не про меня","value":0}]},{"slideDescription":"Соедините утверждения справа и слева так,чтобы они описывали вас лучше всего","questions":[{"text":"Когда я понимаю, что у других студентов получается лучше, это мотивирует меня стараться больше","motivationType":"achievement"},{"text":"Мне важно, чтобы моей работой восхищались и ставили её в пример другим","motivationType":"communication"},{"text":"Я хочу узнать ровно столько, сколько нужно, чтобы получить работу мечты","motivationType":"stability"},{"text":"Меня часто называют перфекционистом, потому что я люблю детально разбираться в темах, которые мне интересны","motivationType":"accuracy"}],"variants":[{"text":"Точно про меня","value":3},{"text":"Скорее про меня","value":2},{"text":"Иногда про меня","value":1},{"text":"Совсем не про меня","value":0}]},{"slideDescription":"Соедините утверждения справа и слева так,чтобы они описывали вас лучше всего","questions":[{"text":"Про меня часто говорят, что я не успокоюсь, пока не добьюсь своего","motivationType":"achievement"},{"text":"Мне нужно с кем-то обсуждать задачи, которые нужно решить, и сравнивать свои решения с решениями других","motivationType":"communication"},{"text":"Я хочу гарантий, что мне помогут справиться со сложностями на пути к новой профессии","motivationType":"stability"},{"text":"Мне свойственны дотошность и придирчивость к деталям","motivationType":"accuracy"}],"variants":[{"text":"Точно про меня","value":3.6},{"text":"Скорее про меня","value":2.4},{"text":"Иногда про меня","value":1.2},{"text":"Совсем не про меня","value":0}]}],"results":{"achievement":{"title":"Достижения и успех","description":"Вам важно чётко видеть цель перед собой. Вы — амбициозный и настроенный на победу студент, готовый сворачивать горы на пути к мечте.","advices":[{"title":"Как не выгореть","description":"Чтобы путь к цели не казался бесконечным, представьте конечный результат — чем чётче, тем лучше. А потом разбейте цель на задачи поменьше и выполняйте одну за другой по мере сил.","backgroundImageSrc":"https:\u002F\u002Fcode.s3.yandex.net\u002Fmotivation\u002Fachievement\u002Fachievement01.png","backgroundImageSrc2x":"https:\u002F\u002Fcode.s3.yandex.net\u002Fmotivation\u002Fachievement\u002Fachievement01x2.png"},{"title":"Как закреплять новые знания","description":"Для этого многие студенты перечитывают всю теорию после сдачи проекта. Теперь делать это гораздо проще: в учебнике появился GPT-помощник, который может кратко пересказать содержание каждого урока. Так вы сэкономите кучу времени.","backgroundImageSrc":"https:\u002F\u002Fcode.s3.yandex.net\u002Fmotivation\u002Fachievement\u002Fachievement02.png","backgroundImageSrc2x":"https:\u002F\u002Fcode.s3.yandex.net\u002Fmotivation\u002Fachievement\u002Fachievement02x2.png"},{"title":"Как справляться с тревогой","description":"Чтобы объём запланированных личных, рабочих и учебных задач перестал вас тревожить, выпишите их на отдельный лист. Как только все задачи будут собраны в одном месте, вы перестанете пугаться их количества и думать о том, как много ещё не сделали.","backgroundImageSrc":"https:\u002F\u002Fcode.s3.yandex.net\u002Fmotivation\u002Fachievement\u002Fachievement03.png","backgroundImageSrc2x":"https:\u002F\u002Fcode.s3.yandex.net\u002Fmotivation\u002Fachievement\u002Fachievement03x2.png"}]},"communication":{"title":"Общение и поддержка","description":"Вы — командный игрок. Вам важно, чтобы рядом были единомышленники, с которыми можно поделиться мыслями и эмоциями о происходящем.","advices":[{"title":"Как строить социальные связи","description":"Задайтесь целью построить учебное комьюнити — многие студенты продолжают общаться и выручать друг друга даже после выпуска. Например, делитесь с одногруппниками вакансиями, ссылками на интересные статьи и дополнительные курсы.","backgroundImageSrc":"https:\u002F\u002Fcode.s3.yandex.net\u002Fmotivation\u002Fcommunication\u002Fcommunication01.png","backgroundImageSrc2x":"https:\u002F\u002Fcode.s3.yandex.net\u002Fmotivation\u002Fcommunication\u002Fcommunication01x2.png"},{"title":"Как поддерживать себя","description":"Если хотите узнать больше историй студентов о том, как им было трудно, но они всё-таки справились, советуем наш совместный с «Либо Либо» подкаст «Собес». Мы верим, что эти рассказы могут очень поддержать в трудную минуту.","backgroundImageSrc":"https:\u002F\u002Fcode.s3.yandex.net\u002Fmotivation\u002Fcommunication\u002Fcommunication02.png","backgroundImageSrc2x":"https:\u002F\u002Fcode.s3.yandex.net\u002Fmotivation\u002Fcommunication\u002Fcommunication02x2.png"},{"title":"Где узнавать о профессии и индустрии","description":"Послушайте плейлист «На курсах не расскажут» на Яндекс Музыке, в который мы добавили наши любимые подкасты про карьеру в IT, технологии, обучение и психологию. Включайте на пробежке или пока моете посуду.","backgroundImageSrc":"https:\u002F\u002Fcode.s3.yandex.net\u002Fmotivation\u002Fcommunication\u002Fcommunication03.png","backgroundImageSrc2x":"https:\u002F\u002Fcode.s3.yandex.net\u002Fmotivation\u002Fcommunication\u002Fcommunication03x2.png"}]},"stability":{"title":"Стабильность и ритм","description":"Вы прагматично подходите к учёбе и стремитесь получить необходимый минимум умений и навыков, чтобы найти стабильную работу","advices":[{"title":"Как концентрироваться","description":"Включите таймер на 15–25 минут и с головой погрузитесь в задачу. Потом сделайте перерыв на 5–10 минут: заварите чай, послушайте музыку. И повторите цикл. Так, небольшими, но существенными шагами придёте к большой цели.","backgroundImageSrc":"https:\u002F\u002Fcode.s3.yandex.net\u002Fmotivation\u002Fstability\u002Fstability01.png","backgroundImageSrc2x":"https:\u002F\u002Fcode.s3.yandex.net\u002Fmotivation\u002Fstability\u002Fstability01x2.png"},{"title":"Как справляться с тревогой","description":"Заносите в таблицу время, которое ежедневно уделяете занятиям. Когда в конце недели посмотрите на отчёт, то увидите, что делаете всё возможное: уделяете учёбе достаточно времени. И станет гораздо спокойнее.","backgroundImageSrc":"https:\u002F\u002Fcode.s3.yandex.net\u002Fmotivation\u002Fstability\u002Fstability02.png","backgroundImageSrc2x":"https:\u002F\u002Fcode.s3.yandex.net\u002Fmotivation\u002Fstability\u002Fstability02x2.png"},{"title":"Где искать мотивацию","description":"Старайтесь замечать каждое достижение и празднуйте их: например, вовремя сданный проект. Иногда с тортом и свечками, иногда как-то ещё. Это будет мотивировать двигаться дальше.","backgroundImageSrc":"https:\u002F\u002Fcode.s3.yandex.net\u002Fmotivation\u002Fstability\u002Fstability03.png","backgroundImageSrc2x":"https:\u002F\u002Fcode.s3.yandex.net\u002Fmotivation\u002Fstability\u002Fstability03x2.png"}]},"accuracy":{"title":"Познание и экспертность","description":"Вы детально изучаете и критически анализируете каждый источник, часто не ограничиваясь только учебными материалами.","advices":[{"title":"Как вести конспекты","description":"Используйте функцию «Краткий пересказ», чтобы сохранить ёмкую версию пройденного урока. А если захотите написать заметку, это можно сделать прямо в учебнике.","backgroundImageSrc":"https:\u002F\u002Fcode.s3.yandex.net\u002Fmotivation\u002Faccuracy\u002Faccuracy01.png","backgroundImageSrc2x":"https:\u002F\u002Fcode.s3.yandex.net\u002Fmotivation\u002Faccuracy\u002Faccuracy01x2.png"},{"title":"Как создать свою базу знаний","description":"Заведите табличку в Notion с полезными ссылками и коротким описанием каждой: кто посоветовал этот источник, какая информация в нём содержится и зачем её изучать.","backgroundImageSrc":"https:\u002F\u002Fcode.s3.yandex.net\u002Fmotivation\u002Faccuracy\u002Faccuracy02.png","backgroundImageSrc2x":"https:\u002F\u002Fcode.s3.yandex.net\u002Fmotivation\u002Faccuracy\u002Faccuracy02x2.png"},{"title":"Как заниматься регулярно","description":"Поставьте еженедельное напоминание — желательно на выходной день — с текстом вроде «15 минут изучать одну ссылку по учёбе». Скорее всего задача затянет, и вы изучите больше одного источника.","backgroundImageSrc":"https:\u002F\u002Fcode.s3.yandex.net\u002Fmotivation\u002Faccuracy\u002Faccuracy03.png","backgroundImageSrc2x":"https:\u002F\u002Fcode.s3.yandex.net\u002Fmotivation\u002Faccuracy\u002Faccuracy03x2.png"}]}}},"promowebinarsUtmConfig":{"utm-url-params":["utm_source","utm_medium","utm_campaign","utm_content","utm_term"]},"bannersConfig":{"profile":{"priority":["price-will-rise","discount-event","referral-discount","check-list","jackpot"],"maxCount":1},"theory":{"priority":["price-will-rise","discount-event","referral-discount","check-list","jackpot"],"maxCount":1}},"exchangeRate":{"tengeToDollar":0.001923},"lxFeedbackNotification":{"high-education-web-developer-magistr":{"startDate":"2025-06-23T00:00:00","endDate":"2025-07-13T23:59:59","currentPollSlug":"semester_2_year_24_25"},"financial-analysis-in-business":{"startDate":"2025-06-23T00:00:00","endDate":"2025-07-13T23:59:59","currentPollSlug":"semester_2_year_24_25"},"product-management-in-fintech":{"startDate":"2025-06-23T00:00:00","endDate":"2025-07-13T23:59:59","currentPollSlug":"semester_2_year_24_25"},"cloud-services-engineer":{"startDate":"2025-06-23T00:00:00","endDate":"2025-07-13T23:59:59","currentPollSlug":"semester_2_year_24_25"},"data-science-in-economics":{"startDate":"2025-06-23T00:00:00","endDate":"2025-07-13T23:59:59","currentPollSlug":"semester_2_year_24_25"},"high-education-data-analyst-magistr":{"startDate":"2025-06-23T00:00:00","endDate":"2025-07-13T23:  ещё она:\n\n* напомнит об учёбе, поддержит тебя;\n* поделится дополнительными материалами;\n* будет держать в курсе наших мероприятий.\n\nПереходи по ссылке — так попадёшь в чат с Юлей в Телеграме.","confirmButtonText":"Открыть чат в Телеграме","confirmButtonLink":"https:\u002F\u002Ft.me\u002Fyandexpracticumyuliabot"},"testProf":{"firstLessonId":"41612fda-9fdd-4c82-951b-b2d6f1780db1","title":"Поможем не забывать о твоей цели","content":"Мы знаем, что учиться сложно. Главное — чётко обозначить цель и стараться каждый день. Мы хотим тебе немного помочь, поэтому придумали чат-бота Юлю.\n\nЮля — одна из героинь истории про маркетолога Стаса, с которым ты познакомишься на нашем курсе. Юля будет сопровождать тебя во время прохождения вводного курса. А ещё она:\n\n* напомнит об учёбе, поддержит тебя;\n* поделится дополнительными материалами;\n* будет держать в курсе наших мероприятий.\n\nПереходи по ссылке — так попадёшь в чат с Юлей в Телеграме.","confirmButtonText":"Открыть чат в Телеграме","confirmButtonLink":"https:\u002F\u002Ft.me\u002Fyandexpracticumyuliabot"}},"taxDeductionInfo":{"maxTaxDeduction":19500,"taxRate":0.13,"profile.order.paymentInfoBlock.1.taxDeduction":"Можно получить налоговый вычет до \u003Cstrong\u003E{price, number, currency}\u003C\u002Fstrong\u003E","profile.order.paymentInfoBlock.2.taxDeduction":"Можно получить налоговый вычет до \u003Cstrong\u003E{price, number, currency}\u003C\u002Fstrong\u003E","faq.taxDeduction.question":"Что такое налоговый вычет на обучение и как его получить?","faq.taxDeduction.answer":"Это что-то вроде кешбэка от государства. Рассмотрим пример.\n\n\nЕсли вы являетесь налоговым резидентом, то есть находитесь на территории РФ более 183 дней в течение 12 месяцев, и работаете по трудовому договору, то каждый месяц ваш работодатель должен отчислять с вашей зарплаты 13% государству, чтобы оплатить подоходный налог.\n\n\nВот из этих денег вы можете вернуть себе до 15 600 рублей в год в виде налогового вычета за обучение. Для этого вам нужно подать соответствующее заявление через личный кабинет на сайте nalog.ru (можно залогиниться через Госуслуги).\n\n\nК заявлению нужно приложить все документы, подтверждающие ваше право на вычет, такие как:\n\n\n1. Справка 2-НДФЛ от вашего работодателя.\n2. Договор на обучение, в нашем случае это [оферта Практикума](https:\u002F\u002Fyandex.ru\u002Flegal\u002Fpraktikum_offer\u002F).\n3. Лицензия на образовательную деятельность. [Вот наша](https:\u002F\u002Fcode.s3.yandex.net\u002FLicense%20YSDA.pdf).\n4. Чеки об оплате обучения. Практикум отправляет эти чеки на ваш эл.адрес, их можно взять оттуда.\n5. Справка о получении образовательных услуг. Чтобы получить нашу справку, напишите в наш чат поддержки.\n\n\nВаше заявление будут рассматривать в налоговой в течение месяца. Инспектор может запросить другие документы, если этих ему покажется недостаточно. В случае успеха вам должны выдать специальное уведомление о праве на вычет. Это уведомление нужно передать в бухгалтерию вашего работодателя.\n\n\nТеперь работодатель должен будет выплачивать вам всю зарплату, не удерживая подоходный налог в пользу государства, пока не выплатит всю сумму вычета.\n\n\nЭто не единственный вариант получения вычета, подробнее можно почитать [на сайте налоговой](https:\u002F\u002Fwww.nalog.gov.ru\u002Frn77\u002Ftaxation\u002Ftaxes\u002Fndfl\u002Fnalog_vichet\u002Fsoc_nv\u002Fsoc_nv_ob\u002F).\n\n\nЕсли у вас остались вопросы про получение вычета, напишите в наш чат поддержки, постараемся ответить."}},"timer":null,"error":null,"getTimerDataLoadingStatus":null,"patchTimerDataLoadingStatus":null},"referralReducer":{"isReferralModalVisible":false,"title":""},"router":{"location":{"pathname":"\u002Ftrainer\u002Fassociated-programs-frontend-st-v2\u002Flesson\u002Fa55e98e1-e9ed-4495-8aa7-e1334d3a0ae2\u002Ftask\u002F6c740ed8-f812-4510-a4a9-979e9749b0b9\u002F","search":"","hash":"","state":undefined,"key":"ncqnar","query":{}},"action":"POP"},"api":{"queries":{},"mutations":{},"provided":{}
